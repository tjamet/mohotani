name: ci

# Runs on the in-cluster Gitea Actions runner. The repo had only a Travis
# config, so no Gitea check ever ran on a pull request.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The vendor directory is committed: -mod=vendor is the default for it.
      - name: Build
        run: go build ./...

      # TestNoSwarm and TestSwarm start a privileged docker:dind container and
      # wait for it forever. They skip themselves when the docker host cannot
      # be reached, so point DOCKER_HOST at nothing: the shared runner must not
      # run privileged containers.
      - name: Test
        env:
          DOCKER_HOST: tcp://127.0.0.1:1
        run:go test -race ./cli/... ./dns/... ./ip/... ./listener/... ./logger/...
